<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gradGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>
  <!-- Outer circle border -->
  <circle cx="100" cy="100" r="95" fill="url(#gradBg)" stroke="url(#gradGold)" stroke-width="4"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4,2"/>
  
  <!-- Shield shape -->
  <path d="M 60 55 Q 100 48 140 55 Q 140 105 100 145 Q 60 105 60 55 Z" fill="#ffffff" stroke="url(#gradGold)" stroke-width="2.5"/>
  
  <!-- Book in shield -->
  <path d="M 75 95 Q 100 88 100 110 Q 100 88 125 95 L 125 118 Q 100 112 100 130 Q 100 112 75 118 Z" fill="#1e3a8a"/>
  <!-- Torch flame -->
  <path d="M 100 62 Q 108 72 100 85 Q 92 72 100 62 Z" fill="#ef4444"/>
  <path d="M 100 68 Q 104 74 100 83 Q 96 74 100 68 Z" fill="#facc15"/>
  <rect x="97" y="84" width="6" height="12" fill="url(#gradGold)" rx="2"/>

  <!-- Top arc text -->
  <path id="textArcTop" d="M 30 100 A 70 70 0 0 1 170 100" fill="none"/>
  <text fill="#ffffff" font-family="'Work Sans', sans-serif" font-size="12" font-weight="bold" letter-spacing="2">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      SK TAMPASUK 1
    </textPath>
  </text>

  <!-- Bottom arc text -->
  <path id="textArcBottom" d="M 170 100 A 70 70 0 0 1 30 100" fill="none"/>
  <text fill="#facc15" font-family="'Work Sans', sans-serif" font-size="10" font-weight="600" letter-spacing="1">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
      KOTA BELUD, SABAH
    </textPath>
  </text>

  <!-- Motto ribbon at bottom -->
  <rect x="52" y="152" width="96" height="18" rx="4" fill="url(#gradGold)" stroke="#1e3a8a" stroke-width="1"/>
  <text x="100" y="165" fill="#0f172a" font-family="'DM Sans', sans-serif" font-size="8" font-weight="bold" text-anchor="middle" letter-spacing="0.5">
    ILMU CAHAYA HIDUP
  </text>
</svg>
